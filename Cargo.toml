[workspace]
resolver = "3"
members = ["crates/*", "apps/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"

# Versions proven to build and run together on this machine in the Step 2 spike.
# No features here: members enable only what their code needs.
[workspace.dependencies]
nwc = "=0.45.2"
nostr = "=0.45.7"
lightning-invoice = "=0.34.2"
# Already in Cargo.lock through lightning-invoice; only the tests sign invoices.
bitcoin = "=0.32.102"
libmacaroon = "=0.4.0"
# Already in Cargo.lock through libmacaroon and reqwest.
base64 = "=0.23.1"
# Already in Cargo.lock through libmacaroon; the OS random source for keys.
getrandom = "=0.4.3"
axum = "=0.8.9"
clap = "=4.6.7"
reqwest = "=0.13.5"
tokio = "=1.54.1"
serde = "=1.0.229"
serde_json = "=1.0.154"
sha2 = "=0.11.1"
subtle = "=2.6.1"
secrecy = "=0.10.3"
zeroize = "=1.9.1"
tracing = "=0.1.44"
tracing-subscriber = "=0.3.23"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
