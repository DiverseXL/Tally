[package]
name = "tally-server"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[[bin]]
name = "tally-server"
path = "src/main.rs"

[dependencies]
axum = { workspace = true }
clap = { workspace = true, features = ["derive"] }
secrecy = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tally-core = { path = "../../crates/tally-core" }
tally-nwc = { path = "../../crates/tally-nwc" }
tally-runner = { path = "../../crates/tally-runner" }
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "signal", "sync"] }
tokio-stream = { workspace = true, features = ["sync"] }
tracing = { workspace = true }

[dev-dependencies]
nostr = { workspace = true }
reqwest = { workspace = true }
tally-runner = { path = "../../crates/tally-runner", features = ["test-support"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
