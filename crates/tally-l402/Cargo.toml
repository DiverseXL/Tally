[package]
name = "tally-l402"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
axum = { workspace = true, default-features = false, features = ["http1", "tokio"] }
base64 = { workspace = true, default-features = false, features = ["std"] }
getrandom = { workspace = true, features = ["std"] }
libmacaroon = { workspace = true }
lightning-invoice = { workspace = true, features = ["std"] }
reqwest = { workspace = true, default-features = false }
secrecy = { workspace = true }
sha2 = { workspace = true }
subtle = { workspace = true }
tally-core = { path = "../tally-core" }
tally-nwc = { path = "../tally-nwc" }
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "sync", "time"] }

[dev-dependencies]
bitcoin = { workspace = true, features = ["secp-recovery", "std"] }

[lints]
workspace = true
