[package]
name = "tally-l402"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[features]
# TEST ONLY helpers, off by default. Only a dev-dependency turns this on, so no
# runtime build of this crate (or of anything that depends on it normally)
# contains the offline invoice generator.
test-support = ["dep:bitcoin"]

[dependencies]
axum = { workspace = true, default-features = false, features = ["http1", "tokio"] }
base64 = { workspace = true, default-features = false, features = ["std"] }
# Only the TEST ONLY generator signs invoices; no other code path uses it.
bitcoin = { workspace = true, optional = true, features = ["secp-recovery", "std"] }
getrandom = { workspace = true, features = ["std"] }
libmacaroon = { workspace = true }
lightning-invoice = { workspace = true, features = ["std"] }
reqwest = { workspace = true, default-features = false }
secrecy = { workspace = true }
sha2 = { workspace = true }
subtle = { workspace = true }
tally-core = { path = "../tally-core" }
tally-nwc = { path = "../tally-nwc" }
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "sync", "time"] }

[dev-dependencies]
# Enables the TEST ONLY helpers for this crate's own test binaries only.
tally-l402 = { path = ".", features = ["test-support"] }

[lints]
workspace = true
